project:
  name: original_volatility_targets
  seed: 20260724
  deterministic: true
  log_level: INFO
  continue_on_experiment_error: true

shared:
  residual_project_root: ../fintexts_semiconductor_prototype
  artifact_profile: light
  processed_candidates:
    - runs/light/data/processed
    - data/processed
  table_candidates:
    - runs/light/outputs/tables
    - outputs/tables
  embedding_candidates:
    - data/embeddings
    - runs/light/data/embeddings
  market_file: market_supervised.parquet
  representation_manifest: representation_manifest.csv
  canonical_events: canonical_events.parquet
  prototype_assignments: prototype_assignments.parquet
  fold_representation_manifest: fold_representation_manifest.csv
  chronological_folds: chronological_folds.csv
  residual_final_decision: final_decision.csv
  residual_validation_results: target_comparison_validation.csv
  residual_test_results: target_comparison_test.csv
  require_compatible_split: true
  require_train_fitted_prototypes: true

universe:
  industry: semiconductor
  tickers: [ADI, AMAT, AMD, AVGO, INTC, KLAC, LRCX, MU, NVDA, QCOM, TXN]

targets:
  epsilon: 1.0e-12
  ticker_spike_quantiles: [0.90, 0.95]
  regime_primary_quantiles: [0.50, 0.90]
  regime_alternative_quantiles: [0.33, 0.67]
  pooled_standardized: true
  sector_spike_minimum_positive: 12
  quick_sector_spike_minimum_positive: 5
  sector_spike_definitions:
    at_least_3: 3
    at_least_5: 5
    at_least_half: 6

features:
  price_prefixes:
    - har_
    - log_variance_lag_
    - log_variance_roll_
    - log_return
    - absolute_log_return
    - historical_mean_log_variance
  exclude_tokens:
    - target_
    - residual
    - spike
    - regime
    - baseline_prediction
    - future
  prototype_representations: [R5, R6, R7, R8]
  placebo_representations: [R9, R10, R11, P_LAGGED, P_PERMUTED]
  lagged_placebo_days: 30

quick:
