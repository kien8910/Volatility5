# Fast development-only screen for LLM-extracted structured target-news events.
# The last 504 development trading dates are divided into two expanding folds:
# 378 train -> 63 validation, then 441 train -> 63 validation. The 2023
# locked test is checked only as a boundary and is never evaluated.
structured_event_pilot:
  output_directory: outputs/structured_event_pilot
  news_levels: [target]
  initial_train_dates: 378
  validation_block_dates: 63
  fold_count: 2
  spike_quantile: 0.90
  lookbacks: [1, 3, 5]
  decay_rate: 0.50
  minimum_feature_count: 10
  inner_validation_fraction: 0.20
  logistic_c_values: [0.1, 1.0]
  model_seed: 20260725
  placebo_seeds: [1001, 1002, 1003]
  audit_sample_size: 200
  # Rough pre-run estimate only. Measured throughput drives the live ETA.
  planning_events_per_minute: 8.0
  minimum_absolute_pr_auc_gain: 0.01
  minimum_relative_pr_auc_gain_percent: 5.0
  maximum_brier_degradation_percent: 1.0
  # Deterministic pre-LLM gate. Its count/mask are included in F1_META, so the
  # structured representations must add signal beyond keyword-gated arrival.
  candidate_filter:
    enabled: true
    patterns:
      - '\bearnings?\b'
      - '\bguidance\b'
      - '\bforecast\b'
      - '\boutlook\b'
      - '\bupgrades?\b'
      - '\bdowngrades?\b'
      - '\bprice target\b'
      - '\bexport (?:ban|restriction|control)s?\b'
      - '\bsanctions?\b'
      - '\bshortages?\b'
      - '\bsupply constraint'
      - '\bmergers?\b'
      - '\bacquisitions?\b'
      - '\bacquires?\b'
      - '\bacquired\b'
      - '\blawsuits?\b'
      - '\blitigation\b'
      - '\bantitrust\b'
      - '\bchief executive\b'
      - '\bCEO\b'
      - '\brevenue (?:rose|fell|grew|declined|beat|missed)\b'
      - '\bprofit (?:rose|fell|grew|declined|beat|missed)\b'
  event_types:
    - earnings_result
    - earnings_guidance
    - analyst_rating
    - product_launch
    - ai_demand
    - memory_price
    - export_restriction
    - fab_capex
    - supply_shortage
    - customer_supplier
    - competition
    - merger_acquisition
    - litigation_regulation
    - macro_rate
    - management_change
    - other
  directions: [positive, negative, mixed, neutral, unknown]
  magnitudes: [small, moderate, large, unknown]
  certainties: [confirmed, expected, rumored, conditional, unknown]
  time_horizons: [immediate, next_quarter, next_year, long_term, unknown]
  entity_roles:
    - target_company
    - competitor
    - supplier
    - customer
    - regulator
    - semiconductor_sector
    - macro_entity
    - other
  extractor:
    model_id: Qwen/Qwen3-8B
    revision: null
    prompt_version: semiconductor_minimal_v1
    trust_remote_code: false
    load_in_4bit: true
    batch_size: 2
    max_input_tokens: 3072
    max_new_tokens: 768
    max_events_per_news: 3
    minimum_valid_rate: 0.95
    maximum_dropped_event_rate: 0.10
    log_every: 20

# Cross-attention follow-up using only the existing daily embedding/prototype
# panels. This experiment never reads structured-event or LLM extraction files.
prototype_cross_attention:
  output_directory: outputs/prototype_cross_attention
  representation_variant_family: grid_k4_pca64_tau0p1
  folds: [1, 2, 3]
  seeds: [11, 29, 47, 71, 101]
  targets: [volatility_level]
  optional_targets: [spike_q90]
  models:
    - PRICE_RIDGE
    - PRICE_META_RIDGE
    - R6_RIDGE
    - PRICE_MLP
    - META_BASIC_MLP
    - R6_META_CONCAT_MLP
    - R6_XATTN
    - R6_META_XATTN
    - R9_META_XATTN
    - R10_META_XATTN
    - R11_META_XATTN
  quick_models:
    - PRICE_MLP
    - META_BASIC_MLP
    - R6_META_CONCAT_MLP
    - R6_META_XATTN
    - R10_META_XATTN
  primary_model: R6_META_XATTN
  fixed_comparators:
    - PRICE_RIDGE
    - PRICE_META_RIDGE
    - R6_RIDGE
    - PRICE_MLP
    - META_BASIC_MLP
    - R6_META_CONCAT_MLP
    - R9_META_XATTN
    - R10_META_XATTN
    - R11_META_XATTN
  prototype_source:
    R6_XATTN: R6
    R6_META_XATTN: R6
    R9_META_XATTN: R9
    R10_META_XATTN: R10
    R11_META_XATTN: R11
  news_levels: [macro, sector, related, target]
  # Deliberately excludes entropy, novelty and centroid distance: those are
  # prototype diagnostics rather than a pure news-arrival metadata control.
  metadata_suffixes:
    - news_count
    - canonical_event_count
    - mean_event_lag_days
    - max_event_lag_days
    - no_news_mask
    - days_since_last_news
    - has_prior_news
  ridge_alpha: 10.0
  spike_quantile: 0.90
  d_model: 64
  n_heads: 4
  hidden_dim: 96
  dropout: 0.15
  batch_size: 256
  max_epochs: 80
  quick_max_epochs: 20
  inner_validation_fraction: 0.20
  patience: 10
  min_delta: 0.0001
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 5.0
  epoch_log_every: 5
  num_workers: 0
  minimum_relative_gain: 0.005
  minimum_cell_win_rate: 0.60
  require_all_fold_mean_wins: true
  locked_test: false

# Transformer V2: a frozen R6-Ridge centre forecast plus an OOF-trained
