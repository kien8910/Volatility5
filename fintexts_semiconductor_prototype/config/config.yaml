project:
  name: fintexts_semiconductor_prototype
  seed: 20260724
  deterministic: true
  log_level: INFO
  n_jobs: -1

universe:
  allow_custom_tickers: false
  industry: semiconductor
  ticker_industry_map:
    ADI: semiconductor
    AMAT: semiconductor
    AMD: semiconductor
    AVGO: semiconductor
    INTC: semiconductor
    KLAC: semiconductor
    LRCX: semiconductor
    MU: semiconductor
    NVDA: semiconductor
    QCOM: semiconductor
    TXN: semiconductor

data:
  dataset_id: EXAONE-BI/FinTexTS
  dataset_config: null
  dataset_split: train
  trust_remote_code: false
  raw_filename: fintexts_raw.parquet
  force_download: false
  tickers:
    - ADI
    - AMAT
    - AMD
    - AVGO
    - INTC
    - KLAC
    - LRCX
    - MU
    - NVDA
    - QCOM
    - TXN
  industry_value: semiconductor

schema:
  mapping_file: config/schema_mapping.yaml
  overrides:
    date: null
    ticker: null
    industry: null
    open: null
    high: null
    low: null
    close: null
    volume: null
    macro_news: []
    sector_news: []
    related_news: []
    target_news: []
  aliases:
    date: [date, trading_date, datetime, timestamp, time]
    ticker: [ticker, symbol, stock, stock_symbol, company_ticker]
    industry: [industry-level, industry_level, industry, sector]
    open: [open, open_price, price_open]
    high: [high, high_price, price_high]
    low: [low, low_price, price_low]
    close: [close, close_price, adj_close, adjusted_close, price_close]
    volume: [volume, trading_volume]
  news_patterns:
    macro_news: ["macro", "market_news", "economy", "economic", "global_news"]
    sector_news: ["sector", "industry_news", "semiconductor_news"]
    related_news: ["related", "peer", "competitor", "supply_chain"]
    target_news: ["target", "company_news", "firm_news", "ticker_news"]

market:
  epsilon: 1.0e-12
  lag_days: 22
  rolling_windows: [5, 10, 22]
  extreme_quantiles: [0.001, 0.01, 0.5, 0.99, 0.999]
  min_positive_price: 1.0e-12

split:
  train_ratio: 0.60
  validation_ratio: 0.20
  test_ratio: 0.20
  n_expanding_folds: 3
  min_train_days: 126
  min_validation_days: 21

events:
  variant: canonical
  placeholder_values:
    - ""
    - "none"
    - "null"
    - "nan"
    - "n/a"
    - "na"
    - "no news"
    - "no_news"
  exact_deduplication: true
  near_duplicate:
    enabled: false
    cosine_threshold: 0.96
    hashing_features: 262144
  related_ticker_regex: "\\b(?:ADI|AMAT|AMD|AVGO|INTC|KLAC|LRCX|MU|NVDA|QCOM|TXN)\\b"

embedding:
  model_name: FinLang/finance-embeddings-investopedia
  official_fintexts_model_name: EXAONE-BI/FinTexTS-Embedding
  official_model_name: EXAONE-BI/FinTexTS-Embedding
  use_official_fintexts_model: false
  backend: sentence_transformers
  batch_size: 64
  max_length: 512
  normalize: true
  device: auto
  cache_dir: data/embeddings/huggingface_cache
  force_rebuild: false
  show_progress_bar: true

prototype:
  k_values: [4, 8, 12, 16, 24, 32]
  pca_dims: [null, 32, 64, 128]
  temperatures: [0.05, 0.10, 0.20, 0.50]
  levels: [macro, sector, related, target]
  clustering: spherical_kmeans
  preferred_k: 8
  preferred_pca_dim: 64
  preferred_temperature: 0.10
  n_init: 20
  max_iter: 500
  min_events_per_cluster: 5
  max_small_cluster_fraction: 0.50
  min_effective_fraction: 0.35
  selection_metric: validation_score
  pooling: mean
  pooling_options: [mean, normalized_sum, max, exponential_decay]
  exponential_half_life_days: 3.0
  max_lag_days: 5
  days_since_sentinel: 3650
  random_projection_dim: 64
  random_prototype_repeats: 5
  aggregate_all_eligible_candidates: true
  # Main holdout materializes the primary prototype seed; prototype_stability
  # and the mandatory chronological full-refit gate still execute all 6 seeds.
  aggregate_all_prototype_seeds: false
  generate_all_pooling_representations: true
  fit_stability_seeds: true
  # Full fold refits run only after validation locks one family. Prebuilding
  # every fold/grid combination here would duplicate the expensive work.
  build_fold_codebooks: false
  build_fold_codebooks_all_seeds: true
  fold_grid_mode: full
  response_aware:
    enabled: true
    response: signed
    k: 8
    lambda_z: 1.0
    lambda_q: 1.0
    signature_types: [signed, absolute, spike]
    lambda_embedding: [1.0]
    lambda_response: [0.25, 1.0]
    assignment_method: text_centroid
    train_tail_fraction: 0.20
    minimum_text_predictability: 0.35
    min_validation_assignment_accuracy: 0.25

baseline:
  ridge_alphas: [0.0, 0.01, 0.1, 1.0, 10.0, 100.0]
  validation_metric: qlike
  min_history_days: 63
  oof_initial_fraction: 0.35
  oof_step_days: 21
  # Keep validation transform-only, matching the strict experiment contract.
  refit_test_with_train_validation: false

targets:
  residual_epsilon: 1.0e-8
  spike_quantiles: [0.90, 0.95]
  regime_quantiles: [0.50, 0.90]
  threshold_modes: [ticker, pooled_standardized]
  top_fraction: 0.10
  fixed_precision_levels: [0.25, 0.50]

models:
  representations: [R0, R1, R2, R3, R4, R5, R6, R7, R8, R9, R10, R11]
  signed: [ridge, elastic_net, mlp]
  magnitude: [ridge, elastic_net, mlp]
  squared: [ridge, elastic_net, mlp]
  spike: [logistic, weighted_logistic, mlp]
  regime: [multinomial_logistic, mlp]
  uncertainty: [gaussian, student_t]
  ridge_alphas: [0.01, 0.1, 1.0, 10.0, 100.0]
  elastic_net_alphas: [0.0001, 0.001, 0.01, 0.1]
  elastic_net_l1_ratios: [0.1, 0.5, 0.9]
  logistic_cs: [0.01, 0.1, 1.0, 10.0]
  mlp_hidden_sizes: [[64], [128], [128, 64]]
  learning_rate: 0.001
  batch_size: 256
  max_epochs: 200
  patience: 20
  min_delta: 0.0001
  gradient_clip: 5.0
  run_all_robustness_seeds: true
  validation_screening:
    enabled: true
    # Every K/PCA/temperature/pooling family is first compared on the tail of
    # TRAIN with a cheap linear model. Only these seed-free family finalists
    # enter the full model grid on the official validation split.
    inner_fraction: 0.15
    minimum_prefix_dates: 63
    top_n_families: 2
    ridge_alpha: 1.0
    logistic_c: 1.0

uncertainty:
  distributions: [gaussian, student_t]
  min_scale: 1.0e-4
  student_t_min_df: 2.01
  interval_levels: [0.80, 0.90, 0.95, 0.99]
  var_levels: [0.95, 0.99]
  pit_bins: 20

placebo:
  shuffle_holdout_dates: false

robustness:
  seeds: [11, 29, 47, 71, 101]
  chronological_folds: 3
  leave_one_ticker_out: true
  leave_one_year_out: true
  trim_extreme_residual_fraction: 0.01
  block_bootstrap_repetitions: 500
  block_length_days: 10
  confidence_level: 0.95

decision:
  min_relative_gain: 0.01
  min_fold_win_rate: 0.60
  min_seed_win_rate: 0.60
  require_better_than:
    - R0
    - R2
    - R3
    - R4
    - R9
    - R10
    - R11
  primary_metrics:
    signed: qlike
    magnitude: spearman
    squared: spearman
    spike: pr_auc
    uncertainty: nll
    regime: macro_f1

outputs:
  required_tables:
    - dataset_summary.csv
    - ticker_summary.csv
    - news_summary.csv
    - event_deduplication_summary.csv
    - canonical_events.csv
    - baseline_results.csv
    - residual_summary.csv
    - prototype_summary.csv
    - prototype_examples.csv
    - prototype_stability.csv
    - target_screening_manifest.csv
    - target_comparison_validation.csv
    - target_comparison_test.csv
    - ticker_level_results.csv
    - news_level_results.csv
    - cross_stock_results.csv
    - placebo_results.csv
    - robustness_results.csv
    - final_decision.csv
  required_figures:
    - volatility_timeseries.png
    - residual_distribution.png
    - residual_correlation_matrix.png
    - news_count_by_day.png
    - prototype_cluster_size.png
    - assignment_entropy.png
    - prototype_usage_over_time.png
    - prototype_ticker_concentration.png
    - spike_rate_by_prototype.png
    - response_breadth_by_prototype.png
    - target_performance_validation_test.png
    - true_vs_shuffled_news.png
    - calibration_curve.png
    - pit_histogram.png
    - interval_coverage.png
